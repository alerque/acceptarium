# off, error, warn, info, debug, or trace (dev builds only)
verbosity = "warn"
dry-run = false
dirty = false
overwrite = false
# filesystem, git-annex
blob-storage = "filesystem"
# sidecar, metadata (git-annex only)
info-storage = "sidecar"
# git, manual
tracker = "git"
# manual, ocr, vision
processor = "manual"
# manual, llm, regex, vision
extractor = "manual"
# hledger, ledger-cli, beancount, custom
export-format = "hledger"
# hjson, json, toml, yaml, xml
dump-format = "yaml"

[filesystem]
directory = "acceptarium"
copy = false
rename = false

[git-annex]
directory = "acceptarium"
copy = false
rename = false

[sidecar]
directory = "acceptarium"
# hjson, json, toml, yaml, xml
format = "toml"
hidden = true

[git]
stage = true
commit = true
message = """
[acceptarium] {{ msg.subject }}

{{ msg.body }}

{% for trailer in msg.trailers -%}
{{ trailer }}
{% endfor -%}
"""

# [metadata]

[templates]
hledger = """
{{- asset.transaction.datetime | date(format="%Y-%m-%d") }}
{{- " (" ~ asset.id }}{% if asset.transaction.invoice_number %}{{ "|" ~ asset.transaction.invoice_number }}{% endif %})
{{- " " }}{{ asset.transaction.payee | default(value="Unknown") }}  ; acceptarium:{{ asset.id }}
{%- if not asset.transaction.items %}
    Expenses:Unknown  {{ asset.transaction.total | default(value=0) }}  {{ asset.transaction.currency | default(value="") }}
{%- endif %}
{%- for posting in asset.transaction.items | default(value=[]) %}
    Expenses:Unknown  {{ posting.quantity | default(value=1) }} @@ {{ posting.amount | default(value=0) }} {{ asset.transaction.currency | default(value="") }} ; {{ posting.description | default(value="") }}
{%- endfor %}
    Assets:Unknown  -{{ asset.transaction.total | default(value=0) }} {{ asset.transaction.currency | default(value="") }} ; type:{{ asset.transaction.payment_type | default(value="") }}, payment_identifier:{{ asset.transaction.payment_identifier | default(value="") }}
"""
beancount = "No default template"
ledger-cli = "No default template"
custom = "Enter a template using Tera syntax in your project config."

[vision]
model = "{{ config.extra.model }}"
preamble = """
You are a data extraction agent that analyzes scanned receipts and derives structured transaction data.
Always respond with valid JSON only, no additional text.\
"""
prompt = """The attached image is a scanned receipt or invoice in {{ config.extra.language }}.

{{ config.extra.prompt }}
"""

[llm]
model = "{{ config.extra.model }}"
preamble = """
You are a data extraction agent that analyzes scanned receipts and derives structured transaction data.
Always respond with valid JSON only, no additional text.\
"""
prompt = """The following content is a scanned receipt or invoice in {{ config.extra.language }} read with OCR.

{{ config.extra.prompt }}

Receipt content:
{{ asset.ocr }}\
"""

[tui]
preview = true
theme = "monokai-pro"

[extra]
## some data, but many mistakes
# model = "gemma3:27b"
## many fields wrong
# model = "granite3.2-vision:latest"
