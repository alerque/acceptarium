## faster than qwen3.5:35b and just about as good but a little spastic
# model = "gemma4:4b"
## fast and solid, best overall to date
# model = "gemma4:26b"
model = "qwen3.6:35b"

## summary of example with no json
# model = "bakllava:7b"
## no results
# model = "deepseek-ocr:3b"
## made up everything
# model = "gemma3:4b"
## made up some, used example for some
# model = "gemma3n:e4b"
## used example
# model = "glm-ocr:bf16"

prompt = """
Look for and extract the following fields in the receipt:
{{ config.extra.field_descriptions }}

Return a JSON object with as many of those fields as were positively detected, for example:
{{ config.extra.sample_json }}\
"""
field_descriptions = """
{% for key, desc in config.extra.fields -%}
- **{{ key }}**: {{ desc }}
{% endfor -%}
"""
sample_json = "{{ config.extra.samples | json_encode(pretty=true) | safe }}"
language = "Turkish"

[extra.fields]
payee = "The vendor, merchant, or payee name, preferring the common business name over corporate divisions"
datetime = "The transaction date in ISO 8601 format (YYYY-MM-DD), or include time (YYYY-MM-DDTHH:MM:SS) if the transaction time can be determined"
type = "The financial document type, most likely 'receipt' or 'invoice'"
invoice_number = "A receipt or invoice number if visible (can be null) that would uniquely identify the transaction to the merchant"
items = """
An array of items with description, quantity, and total amount (as a number) for each line item. \
Note many line items will not have a quantity at all, in which case leave this blank. \
Many lines will have a % number that is a tax rate or tax amount. \
Do not mistake percentages or currency amounts that might be tax values as this quantity field.\
Especially in the case of discounts or coupons, the amount for some line items may be negative.\
Do include line items for discounts that affect the total amount if adding up the items would otherwise come to the wrong total.\
"""
total = "The final total amount with all items, taxes, discounts, fees, etc. as a number without currency symbols"
currency = """
The currency used as its ISO code, for example 'TRY' or 'USD'. \
If not explicitly noted, use the business name or address to guess the country's default currency. \
For example the symbol '$' is ambiguous but a Colorado addresses would imply USD, Alberta would be CAD.\
"""
payment_type = "The payment method used - 'cash', 'credit', 'debt', 'check', or 'other'"
payment_identifier = "The last 4 digits of card or other identifier if visible (can be null)"

[extra.samples]
payee = "My Store Name"
datetime = "2024-01-15T14:30:00"
type = "receipt"
invoice_number = "A000012345"
items = [
  { description = "Item A", quantity = 1, amount = 50.00 },
  { description = "Thing B", quantity = 2, amount = 37.75 },
]
total = 125.50
currency = "USD"
payment_type = "card"
payment_identifier = "**** **** **** 1234"
